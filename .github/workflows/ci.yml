name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run check

  deploy-site:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v5

  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile
      - run: bun run build:cli
      - name: Write release notes
        run: |
          NOTES="${RUNNER_TEMP}/release-notes.md"
          PREV_TAG="$(git tag -l 'release-*' --sort=-version:refname | head -n1)"
          REPO="${{ github.repository }}"

          {
            if [ -n "$PREV_TAG" ]; then
              echo "## Changes since ${PREV_TAG}"
              echo ""
              git -c log.showSignature=false log "${PREV_TAG}..HEAD" --reverse --date=short \
                --format="- **%s** ([%h](https://github.com/${REPO}/commit/%H)) by %an, %ad%n%n%b%n"
              echo ""
              echo "[Compare ${PREV_TAG}...${{ github.sha }}](https://github.com/${REPO}/compare/${PREV_TAG}...${{ github.sha }})"
            else
              BEFORE="${{ github.event.before }}"
              if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                RANGE="HEAD"
                echo "## Changes (first release)"
              else
                RANGE="${BEFORE}..HEAD"
                echo "## Changes since previous push"
              fi
              echo ""
              git -c log.showSignature=false log "$RANGE" --reverse --date=short \
                --format="- **%s** ([%h](https://github.com/${REPO}/commit/%H)) by %an, %ad%n%n%b%n"
            fi
            echo ""
            echo "---"
            echo ""
            echo "**Release commit:** [\`${{ github.sha }}\`](https://github.com/${REPO}/commit/${{ github.sha }}) · workflow run #${{ github.run_number }}"
          } > "$NOTES"

          echo "RELEASE_NOTES_PATH=$NOTES" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: release-${{ github.run_number }}
          name: Release ${{ github.run_number }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          files: dist/chromatic-*
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
